name: wayback-harvest

# Free scheduled cheap-tier compute (unlimited minutes on a public repo).
# Runs the zero-cost Wayback enumeration; commits the resumable index back.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Max hosts to enumerate (blank = all)"
        required: false
        default: ""

jobs:
  wayback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The free tier is stdlib-only, so an editable install pulls no deps.
      - name: Install (core only)
        run: pip install -e .

      # CI runs against a small committed host list (config/ci_hosts.txt) so the
      # job does real work without the sibling CivicAtlasMA inventory CSV. The
      # full 351-town harvest runs from the inventory on the VM, not here.
      - name: Run Wayback sweep (committed host list)
        run: |
          muni-harvest wayback --hosts-file config/ci_hosts.txt ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}

      - name: Upload harvest index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayback-docs
          path: data/wayback/
          if-no-files-found: ignore
