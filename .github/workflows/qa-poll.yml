name: Wait for a reply

# Runs only when somebody asks it to.
#
# This used to poll every twenty minutes, on the reasoning that a routine
# reports green when its session merely started, so the owner's reply should be
# the clock instead. The reasoning was sound and the mechanism was not:
# measured over a night, roughly one scheduled tick in thirteen actually fired.
# GitHub documents that scheduled workflows are delayed under load and may be
# dropped, and that is what happened.
#
# The routine's own scheduler, by contrast, fired 06:20, 08:20, 10:20 and 12:20
# exactly, four for four. So the schedule lives there now, and a reply is picked
# up by the next scheduled run rather than within twenty minutes of arriving.
# That is slower and it actually happens, which is the better trade.
#
# Kept dispatchable because firing a run by hand is still useful.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One agent at a time is a design rule, not a preference.  Two runs working the
  # same bucket would race on the same rows with no lock to take.
  group: civicatlas-qa
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Land the last run's work on main
        # A cloud session pushes to a fresh `claude/*` branch and nothing merges
        # it, so main never moves and the NEXT session clones the same baseline
        # and redoes the same work.  Six sessions produced four branches and
        # three independent rewrites of the same function before anyone noticed.
        #
        # So land finished branches here, before firing the next run, oldest
        # first.  A branch that will not merge cleanly is LEFT ALONE and named
        # in the log: reconciling two different edits to a check is a judgement
        # about documents, not something to resolve with a merge strategy.
        # Divergence should now be rare, because main advances after each run.
        run: |
          git config user.name "civicatlas-qa"
          git config user.email "jamesnicholsworleyassistant@gmail.com"
          git fetch origin '+refs/heads/claude/*:refs/remotes/origin/claude/*' --quiet
          landed=0; stuck=""
          for ref in $(git for-each-ref --sort=committerdate --format='%(refname)' refs/remotes/origin/claude); do
            b=${ref#refs/remotes/}
            [ "$(git rev-list --count main.."$b")" -gt 0 ] || continue
            if git merge --no-edit -m "Land ${b#origin/}" "$b" >/dev/null 2>&1; then
              landed=$((landed+1)); echo "landed $b"
            else
              git merge --abort || true
              stuck="$stuck ${b#origin/}"; echo "CONFLICT, left alone: $b"
            fi
          done
          if [ "$landed" -gt 0 ]; then git push origin main; fi
          echo "landed=$landed stuck=$stuck"
          if [ -n "$stuck" ]; then
            echo "::warning::branches needing a human merge:$stuck"
          fi

      - name: Has the owner replied?
        id: check
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          CLAUDE_ROUTINE_ID: ${{ secrets.CLAUDE_ROUTINE_ID }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
        run: python -m qa.poll --fire

      - name: Record that the question was answered
        # mail_state.json is committed because a fresh clone has no memory of
        # which question is outstanding.  Only the poller writes it.
        run: |
          if git diff --quiet qa/mail_state.json; then
            echo "state unchanged"
          else
            git config user.name "civicatlas-qa"
            git config user.email "jamesnicholsworleyassistant@gmail.com"
            git add qa/mail_state.json
            git commit -m "Question answered; next run started"
            git push
          fi
