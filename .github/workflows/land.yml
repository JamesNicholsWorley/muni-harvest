name: Land a run's work

# A cloud session pushes to its own `claude/*` branch and nothing merges it, so
# main never moves and the NEXT session clones the same baseline and redoes the
# same work. Six sessions once produced four branches and three independent
# rewrites of the same function before anyone noticed.
#
# The poller already lands branches, but it is on a schedule, and GitHub
# documents that scheduled runs are delayed under load and may be dropped
# entirely -- measured here, roughly one tick in thirteen actually fired. That
# is fine for noticing a reply and useless for keeping main current.
#
# A push event is not best-effort. So this lands the work the moment it arrives.

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

concurrency:
  # Two runs landing at once would race on main with no lock to take.
  group: civicatlas-land
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge the branch that was just pushed
        id: merge
        run: |
          git config user.name "civicatlas-qa"
          git config user.email "jamesnicholsworleyassistant@gmail.com"
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if [ "$(git rev-list --count main..origin/$BRANCH)" -eq 0 ]; then
            echo "nothing to land"; echo "landed=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git merge --no-edit -m "Land $BRANCH" "origin/$BRANCH"; then
            echo "landed=yes" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "landed=conflict" >> "$GITHUB_OUTPUT"
            echo "::warning::$BRANCH conflicts with main and was left alone. Reconciling two edits to a check is a judgement about documents, not something a merge strategy should decide."
            exit 0
          fi

      - name: The checks must still pass
        # A merge that lands a broken check is worse than one that does not land.
        # The tests are offline and take under a second; there is no reason to
        # skip them and every reason not to.
        if: steps.merge.outputs.landed == 'yes'
        run: |
          pip install -q pytest
          python -m pytest tests/test_qa_layers.py tests/test_qa_apply.py -q

      - name: Push main
        if: steps.merge.outputs.landed == 'yes'
        run: git push origin main
