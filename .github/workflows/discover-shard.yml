name: discover-shard

# Deep live crawl distributed across N runner IPs. On a runner there's no local
# Wayback index or tier cache, so discover runs pure deep T0 (stdlib) link-graph
# crawl at a high page cap — catching linked/freeform docs the shallow local pass
# (150 pages) missed. Sharding spreads load and parallelizes. Merge -> union locally.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Number of shards / parallel runner IPs"
        default: "20"
      max_pages:
        description: "Deep page cap per host"
        default: "800"
      max_depth:
        description: "BFS depth cap"
        default: "6"
      hosts_file:
        description: "Host list to crawl"
        default: "config/muni_hosts.txt"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          N=${{ github.event.inputs.shards }}
          M=$(python3 -c "import json;N=int('$N');print(json.dumps([f'{i}/{N}' for i in range(1,N+1)]))")
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

  crawl:
    needs: setup
    # MUST stay under GitHub's 6h hard per-job cap. Without this, 16 of 20 shards in the
    # 2026 sweep ran the full six hours and were killed by the platform -- and a hard-cap
    # kill destroys the runner before the `if: always()` upload can run, so those shards
    # produced NO artifact at all. Six hours of crawling each, discarded. A timeout below
    # the cap makes the cancellation graceful, so the upload step still fires and the
    # partial nodes.jsonl survives.
    timeout-minutes: 300
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The `live` extra carries selenium (browser tier) and curl_cffi (TLS impersonation,
      # which the crawler PREFERS for WAF-blocked hosts). ubuntu-latest ships Chrome and
      # Selenium Manager provisions the driver, so no extra install is needed.
      - run: pip install -e ".[live]"
      - name: Assert the WAF tiers are present
        # Both tiers degrade SILENTLY when their library is missing -- curl_cffi absent
        # just means _HAVE_CURL_CFFI is False and every WAF host quietly falls back. Fail
        # the job instead: a crawl that cannot pass a WAF must not report empty results.
        run: |
          python -c "import curl_cffi, selenium; print('curl_cffi', curl_cffi.__version__)"
      - name: Deliver the tier cache
        # data/ is gitignored, so the runner never had tier_cache.jsonl and EVERY host
        # silently fell back to T0 -- stdlib-crawling 21 hosts already known to refuse
        # plain HTTP, which then logged as "0 pages, OK". Ship it via config/ instead.
        run: |
          mkdir -p data
          cp config/tier_cache.jsonl data/tier_cache.jsonl
          echo "tier cache: $(wc -l < data/tier_cache.jsonl) records"
      - name: Deep crawl shard ${{ matrix.shard }}
        run: |
          muni-harvest discover --hosts-file "${{ github.event.inputs.hosts_file }}" \
            --shard "${{ matrix.shard }}" \
            --max-pages ${{ github.event.inputs.max_pages }} \
            --max-depth ${{ github.event.inputs.max_depth }} --workers 4
      - name: Upload shard nodes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-shard-${{ strategy.job-index }}
          # audit.log + stats.jsonl carry the per-host crawl OUTCOME (robots_disallow,
          # waf_403, rate_limited...). Without them a shard that fetched nothing is
          # indistinguishable from a shard whose hosts genuinely had nothing.
          path: |
            data/discover/nodes.jsonl
            data/discover/stats.jsonl
            data/discover/audit.log
          if-no-files-found: ignore

  merge:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - name: Merge deep-crawl nodes
        run: |
          find shards -name nodes.jsonl -exec cat {} + > nodes_deep.jsonl || true
          echo "deep-crawl nodes: $(wc -l < nodes_deep.jsonl)"
      - uses: actions/upload-artifact@v4
        with:
          name: discover-deep-merged
          path: nodes_deep.jsonl
