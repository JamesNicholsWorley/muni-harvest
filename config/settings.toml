# muni-harvest runtime configuration. All paths are relative to the repo root
# unless absolute. Read via muni_harvest.config.load_settings().

[paths]
# The target inventory (429 unique domains) lives in the sibling CivicAtlasMA project.
inventory_csv = "../CivicAtlasMA/data/inventory/master_urls.csv"
data_dir      = "data"

[wayback]
workers      = 20          # latency-bound -> bounded concurrency crushes it (~94min -> ~5min)
per_host_rpm = 60          # polite per-host request rate (RateLimiter)
tries        = 4           # retry/backoff for the ~33% first-try CDX timeouts
timeout_s    = 90
max_pages    = 12          # CDX resumeKey pages per host (2000 rows/page)
collapse     = "urlkey"    # dedup identical captures

[commoncrawl]
# Discovery ONLY (homepage / CMS fingerprint). HTTPS CDN — never the s3:// path (bills silently).
index        = "CC-MAIN-2026-25"
endpoint     = "https://index.commoncrawl.org"

[probe]
workers      = 8           # browser tier is machine-bound, not politeness-bound
sample_paths = ["/", "/robots.txt"]

[discover]
workers          = 12      # one worker per HOST; per-host pacing keeps each polite
max_depth        = 4       # BFS depth cap for the live crawl
max_pages        = 400     # page-fetch cap per host (safety ceiling)
base_delay_s     = 1.0     # per-host AIMD floor (seconds between requests)
max_seed_pages   = 40      # sitemap page-URLs seeded into the crawl frontier
sitemap_max_urls = 20000   # cap on sitemap enumeration per host

[budget]
total_usd = 40.0
