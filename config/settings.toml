# muni-harvest runtime configuration. All paths are relative to the repo root
# unless absolute. Read via muni_harvest.config.load_settings().

[paths]
# The target inventory (429 unique domains) lives in the sibling CivicAtlasMA project.
inventory_csv = "../CivicAtlasMA/data/inventory/master_urls.csv"
data_dir      = "data"

[wayback]
workers      = 20          # latency-bound -> bounded concurrency crushes it (~94min -> ~5min)
per_host_rpm = 60          # polite per-host request rate (RateLimiter)
tries        = 4           # retry/backoff for the ~33% first-try CDX timeouts
timeout_s    = 90
max_pages    = 12          # CDX resumeKey pages per host (2000 rows/page)
collapse     = "urlkey"    # dedup identical captures

[commoncrawl]
# Discovery ONLY (homepage / CMS fingerprint). HTTPS CDN — never the s3:// path (bills silently).
index        = "CC-MAIN-2026-25"
endpoint     = "https://index.commoncrawl.org"

[probe]
workers      = 8           # browser tier is machine-bound, not politeness-bound
sample_paths = ["/", "/robots.txt"]

[discover]
workers           = 12     # one worker per HOST; per-host pacing keeps each polite
max_depth         = 4      # BFS depth cap for the live crawl
max_pages         = 150    # page-fetch cap per host (T0 stdlib crawl)
# Browser-crawl page cap. Was 60, and in the prior-year run 26 of 29 crawled hosts
# stopped at EXACTLY 60 -- the cap was binding nearly everywhere, so those hosts were
# truncated, not exhausted. At ~2s/page, 200 pages still fits per_host_seconds = 1200.
max_pages_browser = 200
max_consec_429    = 5      # circuit-breaker: bail a host after N consecutive 429s
base_delay_s      = 1.0    # per-host AIMD floor (seconds between requests)
max_seed_pages    = 40     # sitemap page-URLs seeded into the crawl frontier
sitemap_max_urls  = 20000  # cap on sitemap enumeration per host
# Wall-clock ceiling per host. The 429 breaker only stops hosts that refuse; a merely
# SLOW host was unbounded, and in the 2026 sweep those ran out the whole 6h job cap.
# 40 shards x ~8 hosts x 20min = well inside the 300min job timeout even worst-case.
per_host_seconds  = 1200
# Write crawl results every N pages instead of only when a host finishes. A shard killed
# mid-host used to lose everything it had crawled; now it loses at most one batch.
flush_every_pages = 25
# Hosts whose CMS ships a blanket `User-agent: * / Disallow: /` -- allowing Googlebot and
# Bingbot while banning everyone else -- over public election records the town is legally
# required to publish. The last three files are byte-identical, so this is a vendor
# default template rather than four town decisions. Bypassed by explicit owner decision
# (2026-08-04), and ONLY these named hosts. The trade is deliberate: we crawl them an
# order of magnitude slower than a normal host and stop far earlier.
# westhamptonma.gov added 2026-08-04: its robots.txt is the same template -- `User-agent:
# * / disallow: /` with allow-lists for Googlebot, bingbot and duckduckbot only.
# NOT listed: cms3.revize.com. That host says `Disallow: /` but explicitly allows
# /*.pdf$, .DOC, .DOCX, .PPT and .PPTX to everyone, so its documents need no override at
# all -- only a robots parser that can read a wildcard Allow (see robots.py).
polite_override_hosts     = ["easton.ma.us", "newbraintreema.us",
                             "townofbarre.com", "townofpalmer.com",
                             "westhamptonma.gov"]
polite_override_delay_s   = 10.0   # vs base_delay_s = 1.0
polite_override_max_pages = 120    # vs max_pages = 150 / deep-crawl 400

[budget]
total_usd = 40.0
